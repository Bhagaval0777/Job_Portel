<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Dashboard</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f9;
    }

    .container {
        display: flex;
        height: 100vh;
    }

    /* LEFT SIDEBAR */
    .sidebar {
        width: 30%;
        background: #1e293b;
        color: white;
        padding: 20px;
        overflow-y: auto;
    }

    .sidebar h2 {
        margin-top: 20px;
        border-bottom: 1px solid #444;
        padding-bottom: 5px;
        font-size: 1.2rem;
    }

    .sidebar h2:first-of-type {
        margin-top: 0; /* Keeps the top neat */
    }

    /* RIGHT CONTENT */
    .main {
        width: 70%;
        padding: 20px;
        overflow-y: auto;
    }

    .form-group {
        display: flex;
        gap: 10px;
    }

    .form-group > div {
        flex: 1;
    }

    input, select, textarea, button {
        width: 100%;
        padding: 8px;
        margin: 8px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    textarea {
        resize: vertical;
        min-height: 80px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #1d4ed8;
    }

    .job-card {
        background: white;
        color: black;
        padding: 10px;
        margin-top: 10px;
        border-radius: 5px;
    }

    .job-card button {
        width: auto;
        margin-right: 5px;
        padding: 5px 10px;
    }

    label {
        font-size: 0.85rem;
        font-weight: bold;
        color: #4b5563;
        display: block;
        margin-top: 10px;
    }

    /* --- CATEGORY SEARCH RESULTS STYLES --- */
    #categoryResults {
        background: white;
        color: #111827; /* Force dark text since sidebar is dark */
        border: 1px solid #ccc;
        border-radius: 5px;
        max-height: 150px;
        overflow-y: auto;
        display: none; 
        margin-bottom: 15px;
    }

    .category-item {
        padding: 10px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
        font-size: 0.9rem;
    }

    .category-item:hover {
        background-color: #dbeafe; 
    }
    
    .selected-indicator {
        color: #4ade80; /* Brighter green to show up on the dark sidebar */
        font-size: 0.85rem;
        font-weight: bold;
        margin-bottom: 15px;
        display: none;
    }
</style>
</head>

<body>

<div class="container">

    <div class="sidebar">

        <h2>Select Category (For Job)</h2>
        <div style="display: flex; gap: 5px; margin-top: 5px; margin-bottom: 5px;">
            <input type="text" id="categorySearch" placeholder="Type category name..." style="margin: 0; color: black;">
            <button onclick="searchCategory()" style="width: auto; margin: 0; padding: 8px 15px;">Search</button>
        </div>
        
        <div id="categoryResults"></div>
        
        <div id="selectedCategoryMsg" class="selected-indicator">✓ Category Selected</div>
        
        <input type="hidden" id="categoryId">
        <h2>Create Category</h2>
        <input type="text" id="categoryName" placeholder="Category Name" style="color: black;">
        <button onclick="createCategory()">Create</button>

        <h2>My Jobs</h2>
        <button onclick="loadJobs()">Refresh Jobs</button>
        <div id="jobList"></div>
    </div>

    <div class="main">
        <h1>Create Job</h1>

        <label>Job Title</label>
        <input type="text" id="title" placeholder="Job Title">
        
        <label>Description</label>
        <textarea id="description" placeholder="Full Job Description..."></textarea>
        
        <label>Location</label>
        <input type="text" id="location" placeholder="City, State, or 'Remote'">

        <div class="form-group">
            <div>
                <label>Work Type</label>
                <select id="workType">
                    <option value="FULL_TIME">Full Time</option>
                    <option value="PART_TIME">Part Time</option>
                </select>
            </div>
            <div>
                <label>Work Mode</label>
                <select id="workMode">
                    <option value="ONSITE">Onsite</option>
                    <option value="REMOTE">Remote</option>
                    <option value="HYBRID">Hybrid</option>
                </select>
            </div>
            <div>
                <label>Employment Type</label>
                <select id="employmentType">
                    <option value="PERMANENT">Permanent</option>
                    <option value="CONTRACT">Contract</option>
                    <option value="FREELANCE">Freelance</option>
                    <option value="INTERNSHIP">Internship</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <div>
                <label>Experience Level</label>
                <select id="experienceLevel">
                    <option value="FRESHER">Fresher</option>
                    <option value="JUNIOR">Junior</option>
                    <option value="MID" selected>Mid Level</option>
                    <option value="SENIOR">Senior</option>
                    <option value="LEAD">Lead</option>
                </select>
            </div>
            <div>
                <label>Years of Exp.</label>
                <input type="number" id="experience" placeholder="e.g. 3" min="0">
            </div>
        </div>

        <div class="form-group">
            <div>
                <label>Min Salary</label>
                <input type="number" step="0.01" id="salaryMin" placeholder="0.00">
            </div>
            <div>
                <label>Max Salary</label>
                <input type="number" step="0.01" id="salaryMax" placeholder="0.00">
            </div>
        </div>

        <label>Skills Required (comma separated)</label>
        <input type="text" id="skills" placeholder="e.g. Python, Django, React">
        
        <label>Tags (comma separated)</label>
        <input type="text" id="tags" placeholder="e.g. backend, remote, startup">

        <div class="form-group">
            <div>
                <label>Deadline</label>
                <input type="date" id="deadline">
            </div>
            <div>
                <label>Vacancies</label>
                <input type="number" id="vacancies" placeholder="1" min="1" value="1">
            </div>
            <div>
                <label>Initial Status</label>
                <select id="status">
                    <option value="DRAFT">Draft</option>
                    <option value="OPEN">Open</option>
                    <option value="CLOSED">Closed</option>
                    <option value="EXPIRED">Expired</option>
                </select>
            </div>
        </div>

        <input type="hidden" id="companyId" value="">

        <button onclick="createJob()" style="margin-top: 20px; padding: 15px;">Create Job</button>

    </div>

</div>

<script>
const BASE_URL = "http://127.0.0.1:8000";
const TOKEN = "YOUR_ACCESS_TOKEN"; // 🔴 replace this

// Helper to safely parse comma-separated lists into arrays
const parseArray = (str) => str.split(',').map(s => s.trim()).filter(s => s.length > 0);

// --- CATEGORY SEARCH LOGIC ---
// Add these variables outside the function to track state
let currentCategoryPage = 1;
let currentCategoryQuery = "";

async function searchCategory(page = 1) {
    const queryInput = document.getElementById("categorySearch").value.trim();
    const resultsContainer = document.getElementById("categoryResults");

    // Hide previous selection indicator if they are making a NEW search
    document.getElementById("selectedCategoryMsg").style.display = "none";
    document.getElementById("categoryId").value = ""; 

    if (queryInput.length === 0) {
        alert("Please enter a category name to search.");
        return;
    }

    // If this is a brand new search (not a pagination click), reset to page 1
    if (page === 1) {
        currentCategoryQuery = queryInput;
        currentCategoryPage = 1;
    } else {
        currentCategoryPage = page;
    }

    try {
        // Fetch from Django Backend - Fixed the page query parameter!
        const res = await fetch(`${BASE_URL}/jobs/categories/search/?q=${currentCategoryQuery}&page=${currentCategoryPage}`, {
            headers: {
                "Authorization": `Bearer ${TOKEN}`
            }
        });

        const data = await res.json();
        resultsContainer.innerHTML = "";

        // Safely extract items whether DRF wraps them in pagination metadata or not
        let items = [];
        let hasNextPage = false;
        let hasPrevPage = false;

        if (data.results && Array.isArray(data.results)) {
            // Unpaginated flat list
            items = data.results;
        } else if (data.results && data.results.results) {
            // Standard DRF Pagination format: { count, next, previous, results: { ... } }
            items = data.results.results;
            hasNextPage = data.next !== null;
            hasPrevPage = data.previous !== null;
        }

        if (items.length > 0) {
            // 1. Loop through and add the category items
            items.forEach(cat => {
                const div = document.createElement("div");
                div.className = "category-item";
                div.textContent = `${cat.name} (${cat.slug})`;
                
                div.onclick = () => selectCategory(cat.category_id, cat.name);
                resultsContainer.appendChild(div);
            });

            // 2. Build the Pagination Controls UI
            const paginationDiv = document.createElement("div");
            paginationDiv.style.display = "flex";
            paginationDiv.style.justifyContent = "space-between";
            paginationDiv.style.alignItems = "center";
            paginationDiv.style.padding = "10px";
            paginationDiv.style.borderTop = "1px solid #ccc";
            paginationDiv.style.background = "#f9fafb";

            // PREV BUTTON
            const prevBtn = document.createElement("button");
            prevBtn.textContent = "« Prev";
            prevBtn.style.width = "auto";
            prevBtn.style.margin = "0";
            prevBtn.style.padding = "5px 10px";
            if (currentCategoryPage > 1) {
                prevBtn.onclick = () => searchCategory(currentCategoryPage - 1);
            } else {
                prevBtn.disabled = true;
                prevBtn.style.opacity = "0.5";
                prevBtn.style.cursor = "not-allowed";
            }

            // PAGE INDICATOR
            const pageInfo = document.createElement("span");
            pageInfo.textContent = `Page ${currentCategoryPage}`;
            pageInfo.style.fontSize = "0.85rem";
            pageInfo.style.color = "#444";
            pageInfo.style.fontWeight = "bold";

            // NEXT BUTTON
            const nextBtn = document.createElement("button");
            nextBtn.textContent = "Next »";
            nextBtn.style.width = "auto";
            nextBtn.style.margin = "0";
            nextBtn.style.padding = "5px 10px";
            // Disable if we got less than 10 items (meaning it's the last page)
            if (items.length === 10 || hasNextPage) {
                nextBtn.onclick = () => searchCategory(currentCategoryPage + 1);
            } else {
                nextBtn.disabled = true;
                nextBtn.style.opacity = "0.5";
                nextBtn.style.cursor = "not-allowed";
            }

            // Append controls
            paginationDiv.appendChild(prevBtn);
            paginationDiv.appendChild(pageInfo);
            paginationDiv.appendChild(nextBtn);
            resultsContainer.appendChild(paginationDiv);

            resultsContainer.style.display = "block"; 
        } else {
            resultsContainer.innerHTML = "<div style='padding: 10px; color: #888;'>No categories found. Try a different search.</div>";
            resultsContainer.style.display = "block";
        }
    } catch (error) {
        console.error("Failed to search categories:", error);
        alert("Server error while searching categories.");
    }
}

function selectCategory(id, name) {
    // 1. Set the hidden ID that createJob() will use
    document.getElementById("categoryId").value = id;      
    
    // 2. Put the selected name in the input box so the user sees it
    document.getElementById("categorySearch").value = name;  
    
    // 3. Hide the results dropdown
    document.getElementById("categoryResults").style.display = "none"; 
    
    // 4. Show a green checkmark message
    document.getElementById("selectedCategoryMsg").style.display = "block";
}
// ------------------------------------

// CREATE CATEGORY
async function createCategory() {
    const name = document.getElementById("categoryName").value;
    if (!name) return alert("Category name is required");

    const res = await fetch(`${BASE_URL}/jobs/categories/create/`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${TOKEN}`
        },
        body: JSON.stringify({ name })
    });

    const data = await res.json();
    alert(data.message || JSON.stringify(data));
}

// LOAD JOBS
async function loadJobs() {
    const res = await fetch(`${BASE_URL}/jobs/create/`, { 
        headers: {
            "Authorization": `Bearer ${TOKEN}`
        }
    });

    const data = await res.json();
    const container = document.getElementById("jobList");
    container.innerHTML = "";

    if (data.data) {
        data.data.forEach(job => {
            const div = document.createElement("div");
            div.className = "job-card";

            div.innerHTML = `
                <b>${job.title}</b><br>
                Status: ${job.status}<br>
                <small>${job.title_slug}</small><br>

                <button onclick="updateJob('${job.title_slug}')">Set Open</button>
                <button onclick="deleteJob('${job.title_slug}')">Delete</button>
            `;

            container.appendChild(div);
        });
    }
}

// CREATE JOB
async function createJob() {
    const deadlineVal = document.getElementById("deadline").value;
    const salaryMin = parseFloat(document.getElementById("salaryMin").value);
    const salaryMax = parseFloat(document.getElementById("salaryMax").value);
    
    // Retrieve the categoryId set by our selectCategory function
    const categoryId = parseInt(document.getElementById("categoryId").value);

    // Validate that a category was searched and selected
    if (isNaN(categoryId)) {
        return alert("Please search for and select a Category in the left sidebar before creating a job.");
    }

    const payload = {
        title: document.getElementById("title").value,
        description: document.getElementById("description").value,
        location: document.getElementById("location").value,
        
        work_type: document.getElementById("workType").value,
        work_mode: document.getElementById("workMode").value,
        employment_type: document.getElementById("employmentType").value,
        experience_level: document.getElementById("experienceLevel").value,
        status: document.getElementById("status").value,
        
        years_of_experience: parseInt(document.getElementById("experience").value) || 0,
        vacancies: parseInt(document.getElementById("vacancies").value) || 1,
        salary_min: isNaN(salaryMin) ? null : salaryMin,
        salary_max: isNaN(salaryMax) ? null : salaryMax,
        
        category: categoryId,
        // 🔴 REMOVED: 'company' field is gone! The backend handles it securely now.
        
        skills_required: parseArray(document.getElementById("skills").value),
        tags: parseArray(document.getElementById("tags").value),
        
        ...(deadlineVal && { deadline: deadlineVal })
    };

    const res = await fetch(`${BASE_URL}/jobs/create/`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${TOKEN}`
        },
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    if(res.ok) {
        alert("Job Created Successfully");
        loadJobs(); 
    } else {
        alert("Error: " + JSON.stringify(data));
    }
}

// UPDATE JOB 
async function updateJob(slug) {
    const res = await fetch(`${BASE_URL}/jobs/update/?title_slug=${slug}`, {
        method: "PATCH",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${TOKEN}`
        },
        body: JSON.stringify({ status: "OPEN" })
    });

    const data = await res.json();
    alert(data.message || "Updated");
    loadJobs();
}

// DELETE JOB
async function deleteJob(slug) {
    const res = await fetch(`${BASE_URL}/jobs/update/?title_slug=${slug}`, {
        method: "DELETE",
        headers: {
            "Authorization": `Bearer ${TOKEN}`
        }
    });

    const data = await res.json();
    alert(data.message || "Deleted");
    loadJobs();
}
</script>

</body>
</html>

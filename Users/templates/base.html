<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <title>{% block title %}JobPortel{% endblock %}</title>

    <style>
      body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; font-family: sans-serif; }
      header, footer { padding: 1rem; background: #f4f4f4; border-bottom: 1px solid #ddd; }
      main { flex: 1; padding: 20px; }
      footer { text-align: center; color: #666; }
    </style>
  </head>
  <body>
    <header>
      <h1>JobPortel</h1>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      <small>&copy; 2026 JobPortel</small>
    </footer>

    <script>
      // Global CSRF Helper
      window.getCookie = function(name) {
          let cookieValue = null;
          if (document.cookie && document.cookie !== '') {
              const cookies = document.cookie.split(';');
              for (let i = 0; i < cookies.length; i++) {
                  const cookie = cookies[i].trim();
                  if (cookie.substring(0, name.length + 1) === (name + '=')) {
                      cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                      break;
                  }
              }
          }
          return cookieValue;
      };

      // Global Smart Fetch for the whole project
window.authFetch = async function(url, options = {}) {
    let access = localStorage.getItem('access_token');
    let refresh = localStorage.getItem('refresh_token');

    // 1. Initial check: If no access token, don't even try
    if (!access) {
        window.location.href = '/users/login/';
        return null;
    }

    options.headers = {
        'Content-Type': 'application/json',
        'X-CSRFToken': window.getCookie('csrftoken'),
        ...options.headers,
        'Authorization': `Bearer ${access}`
    };

    let response = await fetch(url, options);

    // 2. Silent Refresh logic
    if (response.status === 401 && refresh) {
        // Prevent infinite loops by checking a custom flag
        if (options._isRetry) {
            localStorage.clear();
            window.location.href = '/users/login/';
            return null;
        }

        const refreshRes = await fetch('/users/token/refresh/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ refresh: refresh })
        });

        if (refreshRes.ok) {
            const data = await refreshRes.json();
            localStorage.setItem('access_token', data.access);
            
            // CRITICAL: Update refresh token if the server rotates it
            if (data.refresh) {
                localStorage.setItem('refresh_token', data.refresh);
            }

            // Retry the original request with the new token
            options.headers['Authorization'] = `Bearer ${data.access}`;
            options._isRetry = true; // Mark this as a retry
            return await fetch(url, options);
        } else {
            // Refresh token is truly dead
            localStorage.clear();
            window.location.href = '/users/login/';
            return null;
        }
    }
    return response;
};
    </script>
  </body>
</html>

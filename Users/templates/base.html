<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <title>{% block title %}JobPortel{% endblock %}</title>

    <style>
      body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; font-family: sans-serif; }
      header, footer { padding: 1rem; background: #f4f4f4; border-bottom: 1px solid #ddd; }
      main { flex: 1; padding: 20px; }
      footer { text-align: center; color: #666; }
    </style>
  </head>
  <body>
    <header>
      <h1>JobPortal</h1>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      <small>&copy; 2026 JobPortel</small>
    </footer>

    <script>
      // 1. IN-MEMORY TOKEN STORAGE (Immune to XSS, cleared on refresh/close)
      window.accessToken = null;

      // Global CSRF Helper
      window.getCookie = function(name) {
          let cookieValue = null;
          if (document.cookie && document.cookie !== '') {
              const cookies = document.cookie.split(';');
              for (let i = 0; i < cookies.length; i++) {
                  const cookie = cookies[i].trim();
                  if (cookie.substring(0, name.length + 1) === (name + '=')) {
                      cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                      break;
                  }
              }
          }
          return cookieValue;
      };

      // 2. RE-DESIGNED GLOBAL SMART FETCH
      // The Django middleware handles the heavy lifting. This wrapper simply applies 
      // the in-memory token and captures token updates from response headers.
      window.authFetch = async function(url, options = {}) {
          options.headers = {
              'Content-Type': 'application/json',
              'X-CSRFToken': window.getCookie('csrftoken'),
              ...options.headers
          };

          // Append access token if we have it in memory
          if (window.accessToken) {
              options.headers['Authorization'] = `Bearer ${window.accessToken}`;
          }

          try {
              let response = await fetch(url, options);

              // Capture the new token if the Django middleware executed a silent refresh
              const mutatedToken = response.headers.get('X-New-Access-Token');
              if (mutatedToken) {
                  console.log("Middleware successfully refreshed token. Updating JS memory.");
                  window.accessToken = mutatedToken;
              }

              // Handle full session expirations (Both tokens dead)
              if (response.status === 401) {
                  console.warn("Session expired. Redirecting to login view.");
                  window.accessToken = null;
                  window.location.href = '/users/login/';
                  return null;
              }

              return response;
          } catch (error) {
              console.error("Critical error in secure routing handler:", error);
              throw error;
          }
      };

      // 3. PERSISTENCE ENGINE (Handles Page Refreshes / F5)
      // On page load, the app hits a generic protected path or user detail view. 
      // If a valid HttpOnly refresh cookie exists, the middleware drops a brand new 
      // access token right back into the response header context.
      window.addEventListener('DOMContentLoaded', async () => {
          // Do not attempt refresh execution if the browser is currently standing on the login page
          if (window.location.pathname === '/users/login/') return;

          console.log("Detecting application startup. Resolving active session headers...");
          try {
              // Target an arbitrary lightweight endpoint requiring user authentication
              await window.authFetch('/users/details/');
          } catch (err) {
              console.log("Initial session boot validation halted.");
          }
      });
    </script>
  </body>
</html>

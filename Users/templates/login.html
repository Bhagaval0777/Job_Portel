{% extends "base.html" %}

{% block title %}Log in - JobPortel{% endblock %}

{% block content %}
<style>
  :root {
    --primary-color: #4f46e5;
    --primary-hover: #4338ca;
    --error-bg: #fef2f2;
    --error-text: #991b1b;
    --error-border: #fecaca;
  }

  .login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 20px;
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  }

  .login-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .login-header h2 {
    font-size: 1.875rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 8px;
  }

  .login-header p {
    color: #6b7280;
    font-size: 0.875rem;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    color: #374151;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 1rem;
    transition: all 0.2s;
  }

  input:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
  }

  #login-error {
    display: none;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 8px;
    background-color: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error-text);
    font-size: 0.875rem;
  }

  .shake {
    animation: shake-anim 0.4s ease-in-out;
  }

  @keyframes shake-anim {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  button[type="submit"] {
    width: 100%;
    padding: 12px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  button[type="submit"]:hover {
    background-color: var(--primary-hover);
  }

  button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }
</style>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Please enter your details to sign in</p>
    </div>

    <div id="login-error" role="alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="id_email">Email Address</label>
        <input type="email" id="id_email" name="username" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="id_password">Password</label>
        <input type="password" id="id_password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="submit-btn">Sign In</button>
    </form>
    <a href="/users/templates/" style="display: block; text-align: center; margin-top: 16px; color: #4f46e5; font-size: 0.875rem;">Don't have an account? Sign up</a>
  </div>
</div>

<script>
// Helper to get Django CSRF Token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function showError(message) {
    const errorBox = document.getElementById('login-error');
    errorBox.innerText = message;
    errorBox.style.display = 'block';
    errorBox.classList.remove('shake');
    void errorBox.offsetWidth; // Trigger reflow
    errorBox.classList.add('shake');
}

const loginForm = document.getElementById('login-form');
const submitBtn = document.getElementById('submit-btn');

loginForm.onsubmit = async (e) => {
    e.preventDefault();
    
    document.getElementById('login-error').style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.innerText = 'Signing in...';

    try {
        const response = await fetch('/users/login/', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({
                user_email: document.getElementById('id_email').value,
                password: document.getElementById('id_password').value
            }),
            credentials: 'same-origin'
        });

        if (response.ok) {
            window.location.href = '/users/home/';
            return;
        }

        const data = await response.json();
        showError(data.detail || 'Invalid email or password.');

    } catch (err) {
        showError('A connection error occurred. Please try again.');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In';
    }
};
</script>
{% endblock %}

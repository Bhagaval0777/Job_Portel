<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('dark') === 'true' }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobSeeker Profile | Create & Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .input-style { @apply w-full p-3 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none transition-all; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-gray-900 text-slate-900 dark:text-gray-100 antialiased transition-colors duration-300">

    <nav class="sticky top-0 z-50 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 mb-8">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <span class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-indigo-500 bg-clip-text text-transparent">JobPortal</span>
            <div class="flex items-center space-x-4">
                <button @click="darkMode = !darkMode; localStorage.setItem('dark', darkMode)" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
                    <template x-if="!darkMode">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </template>
                    <template x-if="darkMode">
                        <svg class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
                    </template>
                </button>
                <div class="w-10 h-10 rounded-full bg-blue-500 border-2 border-white dark:border-gray-600"></div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 pb-20">
        <form id="profileForm" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white dark:bg-gray-800 rounded-3xl p-8 shadow-sm border border-gray-100 dark:border-gray-700">
                    <div class="text-center mb-6">
                        <div class="relative inline-block group">
                            <div class="w-32 h-32 rounded-full bg-gray-100 dark:bg-gray-700 mx-auto flex items-center justify-center overflow-hidden border-4 border-white dark:border-gray-800 shadow-lg">
                                <span class="text-gray-400">User Photo</span>
                            </div>
                            <label class="absolute bottom-1 right-1 bg-blue-600 p-2 rounded-full cursor-pointer text-white shadow-md hover:scale-110 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                                <input type="file" class="hidden">
                            </label>
                        </div>
                        <h2 class="mt-4 text-xl font-bold">Personal Profile</h2>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-bold uppercase tracking-wider text-gray-500">First Name</label>
                            <input type="text" name="firstname" placeholder="Enter first name" class="input-style mt-1">
                        </div>
                        <div>
                            <label class="text-xs font-bold uppercase tracking-wider text-gray-500">Last Name</label>
                            <input type="text" name="lastname" placeholder="Enter last name" class="input-style mt-1">
                        </div>
                        <div>
                            <label class="text-xs font-bold uppercase tracking-wider text-gray-500">Phone</label>
                            <input type="tel" name="phonenumber" placeholder="+1 234 567 890" class="input-style mt-1">
                        </div>
                        <div>
                            <label class="text-xs font-bold uppercase tracking-wider text-gray-500">Gender</label>
                            <select name="gender" class="input-style mt-1 appearance-none">
                                <option>Male</option>
                                <option>Female</option>
                                <option>Non-binary</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="w-full mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/20 transition-all">
                        Save Changes
                    </button>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6" x-data="{ 
                    locations: ['Remote', 'New York'], 
                    newLoc: '',
                    skills: ['Power BI', 'Django'],
                    newSkill: ''
                }">
                    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
                        <h3 class="font-bold mb-4 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                            Preferred Locations
                        </h3>
                        <div class="flex flex-wrap gap-2 mb-4">
                            <template x-for="(loc, index) in locations" :key="index">
                                <span class="bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-300 px-3 py-1 rounded-full text-sm flex items-center">
                                    <span x-text="loc"></span>
                                    <button @click="locations.splice(index, 1)" type="button" class="ml-2 hover:text-red-500">✕</button>
                                </span>
                            </template>
                        </div>
                        <input type="text" x-model="newLoc" @keydown.enter.prevent="if(newLoc) { locations.push(newLoc); newLoc = '' }" placeholder="Add City + Enter" class="w-full bg-transparent border-b border-gray-200 dark:border-gray-700 py-2 outline-none text-sm focus:border-blue-500 transition-colors">
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
                        <h3 class="font-bold mb-4 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Expertise & Skills
                        </h3>
                        <div class="flex flex-wrap gap-2 mb-4">
                            <template x-for="(skill, index) in skills" :key="index">
                                <span class="bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-300 px-3 py-1 rounded-full text-sm flex items-center">
                                    <span x-text="skill"></span>
                                    <button @click="skills.splice(index, 1)" type="button" class="ml-2 hover:text-red-500">✕</button>
                                </span>
                            </template>
                        </div>
                        <input type="text" x-model="newSkill" @keydown.enter.prevent="if(newSkill) { skills.push(newSkill); newSkill = '' }" placeholder="Add Skill + Enter" class="w-full bg-transparent border-b border-gray-200 dark:border-gray-700 py-2 outline-none text-sm focus:border-green-500 transition-colors">
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-3xl p-8 shadow-sm border border-gray-100 dark:border-gray-700">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold">Work Experience</h3>
                        <button type="button" class="text-blue-600 text-sm font-bold hover:underline">+ Add Experience</button>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 p-4 rounded-2xl bg-gray-50 dark:bg-gray-700/50 relative group">
                        <button type="button" class="absolute top-2 right-2 text-gray-400 hover:text-red-500">Remove</button>
                        <div class="md:col-span-2">
                            <label class="text-xs font-bold text-gray-400">Company Name</label>
                            <input type="text" name="company" placeholder="e.g. Google" class="input-style py-2 text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-400">Role</label>
                            <input type="text" name="role" placeholder="Software Engineer" class="input-style py-2 text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-400">Employment Type</label>
                            <select class="input-style py-2 text-sm">
                                <option>Full-time</option>
                                <option>Internship</option>
                                <option>Contract</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="text-xs font-bold text-gray-400">Description</label>
                            <textarea rows="3" class="input-style text-sm" placeholder="Summarize your impact..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-3xl p-8 shadow-sm border border-gray-100 dark:border-gray-700">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold">Education</h3>
                        <button type="button" class="text-blue-600 text-sm font-bold hover:underline">+ Add Education</button>
                    </div>
                    <p class="text-gray-400 text-sm italic">No education records added yet. Click "+ Add Education" to begin.</p>
                </div>

            </div>
        </form>
    </main>

</body>
</html>

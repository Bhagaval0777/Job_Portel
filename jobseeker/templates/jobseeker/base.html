{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobPlex{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #0f172a; color: white; }
        
        /* THE TEXT FIX: FORCING DARK BG AND WHITE TEXT */
        .input-style { 
            @apply w-full p-3 rounded-xl border outline-none text-sm transition-all;
            background-color: #1e293b !important; 
            color: #ffffff !important; 
            border-color: #334155 !important;
        }
        .input-style:focus { border-color: #0052EA !important; }
        
        .card-style { @apply bg-[#1e293b] rounded-3xl p-6 border border-slate-700 shadow-xl; }
        .label-style { @apply text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2 block; }
    </style>
</head>
<body class="antialiased">
    <header class="bg-[#0f172a] border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 w-8 h-8 rounded-lg flex items-center justify-center font-bold">J</div>
                <span class="font-black tracking-tight uppercase">JobPlex</span>
            </div>
            <nav class="flex gap-6 text-sm text-slate-400">
                <a href="#" class="text-white border-b-2 border-blue-600 pb-1">My Profile</a>
                <a href="#">Jobs</a>
                <a href="#">Help</a>
            </nav>
        </div>
    </header>
    <main class="py-10 px-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>

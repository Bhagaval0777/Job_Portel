{% extends "jobseeker/base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold mb-8">MY PROFILE DASHBOARD</h1>

    <form id="profileForm" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        {% csrf_token %}

        <!-- PERSONAL INFO -->
        <div class="card-style space-y-6">
            <h3 class="font-bold text-lg">Personal Information</h3>

            <!-- PROFILE IMAGE DISPLAY ONLY -->
            <div class="flex items-center gap-4 p-4 bg-slate-900/50 rounded-2xl border border-slate-700">
                <div class="w-20 h-20 bg-slate-800 rounded-xl overflow-hidden border border-slate-600 flex items-center justify-center">
                    {% if profile.profile_pic %}
                        <img src="{{ profile.profile_pic.url }}" class="w-full h-full object-cover">
                    {% else %}
                        <span class="text-slate-500 text-[10px] font-bold">NO PHOTO</span>
                    {% endif %}
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="label-style">First Name</label>
                    <input type="text" name="firstname" value="{{ profile.firstname }}" class="input-style">
                </div>

                <div>
                    <label class="label-style">Last Name</label>
                    <input type="text" name="lastname" value="{{ profile.lastname }}" class="input-style">
                </div>

                <!-- PHONE -->
                <div>
                    <label class="label-style">Phone Number</label>
                    <input type="text" name="phone" value="{{ profile.phone }}" class="input-style">
                    <p id="phoneError" class="text-red-500 text-xs"></p>
                </div>

                <!-- GENDER -->
                <div>
                    <label class="label-style">Gender</label>
                    <div class="flex gap-4 mt-2">
                        <label><input type="radio" name="gender" value="male"> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="other"> Other</label>
                    </div>
                    <p id="genderError" class="text-red-500 text-xs"></p>
                </div>
            </div>

            <!-- BUTTON -->
            <div class="flex justify-end">
                <button class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-semibold">
                    Save Changes
                </button>
            </div>
        </div>

        <!-- LOCATIONS -->
        <div class="card-style">
            <h3 class="font-bold mb-4">Preferred Locations</h3>

            <div id="locations-container"></div>

            <div class="flex gap-2 mt-3">
                <input type="text" id="locationInput" class="input-style" placeholder="Add Location">
                <button type="button" onclick="addLocation()" class="bg-blue-600 px-3 rounded">Add</button>
            </div>
        </div>

        <!-- SKILLS -->
        <div class="card-style">
            <h3 class="font-bold mb-4">Skills</h3>

            <div id="skills-container"></div>

            <div class="flex gap-2 mt-3">
                <input type="text" id="skillInput" class="input-style" placeholder="Add Skill">
                <button type="button" onclick="addSkill()" class="bg-blue-600 px-3 rounded">Add</button>
            </div>
        </div>

    </form>
</div>

<script>
// ADD LOCATION
function addLocation(value = "") {
    let input = document.getElementById("locationInput");
    let val = value || input.value.trim();
    if (!val) return;

    let container = document.getElementById("locations-container");

    let div = document.createElement("div");
    div.className = "flex gap-2 mt-2";

    div.innerHTML = `
        <input type="text" name="locations[]" value="${val}" class="input-style">
        <button type="button" onclick="this.parentElement.remove()">❌</button>
    `;

    container.appendChild(div);
    input.value = "";
}

// ADD SKILL
function addSkill(value = "") {
    let input = document.getElementById("skillInput");
    let val = value || input.value.trim();
    if (!val) return;

    let container = document.getElementById("skills-container");

    let div = document.createElement("div");
    div.className = "flex gap-2 mt-2";

    div.innerHTML = `
        <input type="text" name="skills[]" value="${val}" class="input-style">
        <button type="button" onclick="this.parentElement.remove()">❌</button>
    `;

    container.appendChild(div);
    input.value = "";
}

// FORM SUBMIT
document.getElementById("profileForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let firstname = document.querySelector('input[name="firstname"]').value;
    let lastname = document.querySelector('input[name="lastname"]').value;
    let phone = document.querySelector('input[name="phone"]').value;
    let gender = document.querySelector('input[name="gender"]:checked');

    let isValid = true;

    // PHONE VALIDATION
    if (!/^\d{10}$/.test(phone)) {
        document.getElementById("phoneError").innerText = "Enter valid 10-digit number";
        isValid = false;
    } else {
        document.getElementById("phoneError").innerText = "";
    }

    // GENDER VALIDATION
    if (!gender) {
        document.getElementById("genderError").innerText = "Select gender";
        isValid = false;
    } else {
        document.getElementById("genderError").innerText = "";
    }

    if (!isValid) return;

    let skills = [];
    document.querySelectorAll('input[name="skills[]"]').forEach(input => {
        if (input.value.trim()) {
            skills.push({ skill_name: input.value.trim() });
        }
    });

    let locations = [];
    document.querySelectorAll('input[name="locations[]"]').forEach(input => {
        if (input.value.trim()) {
            locations.push({ location_name: input.value.trim() });
        }
    });

    let data = {
        full_name: firstname + " " + lastname,
        phone_number: phone,
        gender: gender.value,
        skills: skills,
        locations: locations
    };

    fetch("/jobseeker/profile/", {
        method: "PATCH",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(response => {
        console.log(response);

        if (response.message) {
            alert("Profile updated successfully ✅");
        } else {
            alert("Error: " + JSON.stringify(response));
        }
    })
    .catch(err => {
        console.error(err);
        alert("Something went wrong ❌");
    });
});
</script>

{% endblock %}

{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="max-w-7xl mx-auto space-y-6">

    <h1 class="text-3xl font-bold">Profile Dashboard</h1>

    <!-- ALERTS -->
    <div id="error-banner" class="hidden p-3 bg-red-100 text-red-700 rounded"></div>
    <div id="success-banner" class="hidden p-3 bg-green-100 text-green-700 rounded"></div>

    <form id="profileForm">
        {% csrf_token %}

        <!-- PERSONAL -->
        <div class="card">
            <h2 class="title">Personal Info</h2>

            <input name="full_name" placeholder="Full Name" class="input">
            <input name="phone_number" placeholder="Phone Number" class="input">
            <input name="headline" placeholder="Headline" class="input">
            <textarea name="bio" placeholder="Bio" class="input"></textarea>

            <div class="flex gap-4">
                <label><input type="radio" name="gender" value="male"> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
                <label><input type="radio" name="gender" value="other"> Other</label>
            </div>

            <button class="btn-save">Save Profile</button>
        </div>

        <!-- SKILLS -->
        <div class="card">
            <div class="flex justify-between">
                <h2 class="title">Skills</h2>
                <button type="button" onclick="addSkill()" class="btn-add">+ Add</button>
            </div>
            <div id="skills-container"></div>
        </div>

        <!-- LOCATION -->
        <div class="card">
            <div class="flex justify-between">
                <h2 class="title">Locations</h2>
                <button type="button" onclick="addLocation()" class="btn-add">+ Add</button>
            </div>
            <div id="locations-container"></div>
        </div>

        <!-- EXPERIENCE -->
        <div class="card">
            <div class="flex justify-between">
                <h2 class="title">Experience</h2>
                <button type="button" onclick="addExperience()" class="btn-add">+ Add</button>
            </div>
            <div id="experience-container"></div>
        </div>

        <!-- EDUCATION -->
        <div class="card">
            <div class="flex justify-between">
                <h2 class="title">Education</h2>
                <button type="button" onclick="addEducation()" class="btn-add">+ Add</button>
            </div>
            <div id="education-container"></div>
        </div>

    </form>
</div>

<style>
body { background:#f1f5f9; }
.card {
    background:white;
    padding:20px;
    border-radius:16px;
    border:1px solid #e2e8f0;
}
.input {
    width:100%;
    margin-bottom:10px;
    padding:10px;
    border-radius:10px;
    border:1px solid #ddd;
}
.btn-add { background:#6366f1;color:white;padding:5px 10px;border-radius:8px; }
.btn-save { background:#10b981;color:white;padding:8px 15px;border-radius:10px;margin-top:10px; }
.btn-update { background:#3b82f6;color:white;padding:4px 10px;border-radius:6px; }
.btn-delete { background:#ef4444;color:white;padding:4px 10px;border-radius:6px; }
</style>

<script>

// ─────────── HELPERS ───────────
function getHeaders() {
    return {
        'Content-Type': 'application/json',
        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
    };
}

function showBanner(type, msg) {
    const err = document.getElementById('error-banner');
    const ok = document.getElementById('success-banner');
    err.classList.add('hidden');
    ok.classList.add('hidden');

    if (type === 'error') {
        err.innerText = msg;
        err.classList.remove('hidden');
    } else {
        ok.innerText = msg;
        ok.classList.remove('hidden');
    }
}

// ─────────── PROFILE SAVE ───────────
document.getElementById('profileForm').addEventListener('submit', async function(e){
    e.preventDefault();

    const payload = {
        full_name: document.querySelector('[name="full_name"]').value,
        phone_number: document.querySelector('[name="phone_number"]').value,
        headline: document.querySelector('[name="headline"]').value,
        bio: document.querySelector('[name="bio"]').value,
        gender: document.querySelector('input[name="gender"]:checked')?.value
    };

    const res = await fetch('/jobseeker/profile/', {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (data.success) {
        showBanner('success',"Profile Saved");
    } else {
        showBanner('error', JSON.stringify(data));
    }
});

// ─────────── COMMON DELETE ───────────
async function deleteItem(btn,type){
    const el = btn.parentElement;
    const id = el.querySelector('input[type=hidden]').value;

    if(id){
        await fetch(`/jobseeker/profile/${type}/${id}/`,{
            method:'DELETE',
            headers:getHeaders()
        });
    }
    el.remove();
}

// ─────────── SKILLS ───────────
function addSkill(data={}){
    const div = document.createElement('div');
    div.innerHTML = `
        <input type="hidden" value="${data.skill_id||''}">
        <input class="input" value="${data.skill_name||''}">
        <button onclick="saveSkill(this)" class="btn-update">Save</button>
        <button onclick="deleteItem(this,'skill')" class="btn-delete">X</button>
    `;
    document.getElementById('skills-container').appendChild(div);
}

async function saveSkill(btn){
    const el = btn.parentElement;
    const id = el.children[0].value;
    const name = el.children[1].value;

    const res = await fetch(id?`/jobseeker/profile/skill/${id}/`:'/jobseeker/profile/skill/',{
        method:id?'PATCH':'POST',
        headers:getHeaders(),
        body:JSON.stringify({skill_name:name})
    });

    const d = await res.json();
    if(!id && d.success) el.children[0].value = d.data.skill_id;
}

// ─────────── LOCATION ───────────
function addLocation(data={}){
    const div = document.createElement('div');
    div.innerHTML = `
        <input type="hidden" value="${data.location_id||''}">
        <input class="input" value="${data.location_name||''}">
        <button onclick="saveLocation(this)" class="btn-update">Save</button>
        <button onclick="deleteItem(this,'location')" class="btn-delete">X</button>
    `;
    document.getElementById('locations-container').appendChild(div);
}

async function saveLocation(btn){
    const el = btn.parentElement;
    const id = el.children[0].value;
    const name = el.children[1].value;

    const res = await fetch(id?`/jobseeker/profile/location/${id}/`:'/jobseeker/profile/location/',{
        method:id?'PATCH':'POST',
        headers:getHeaders(),
        body:JSON.stringify({location_name:name})
    });

    const d = await res.json();
    if(!id && d.success) el.children[0].value = d.data.location_id;
}

// ─────────── EXPERIENCE ───────────
function addExperience(data={}){
    const div = document.createElement('div');
    div.innerHTML = `
        <input type="hidden" value="${data.experience_id||''}">
        <input placeholder="Company" class="input">
        <input placeholder="Role" class="input">
        <button onclick="saveExperience(this)" class="btn-update">Save</button>
        <button onclick="deleteItem(this,'experience')" class="btn-delete">X</button>
    `;
    document.getElementById('experience-container').appendChild(div);
}

async function saveExperience(btn){
    const el = btn.parentElement;
    const id = el.children[0].value;

    const payload = {
        company_name: el.children[1].value,
        role: el.children[2].value
    };

    const res = await fetch(id?`/jobseeker/profile/experience/${id}/`:'/jobseeker/profile/experience/',{
        method:id?'PATCH':'POST',
        headers:getHeaders(),
        body:JSON.stringify(payload)
    });

    const d = await res.json();
    if(!id && d.success) el.children[0].value = d.data.experience_id;
}

// ─────────── EDUCATION ───────────
function addEducation(data={}){
    const div = document.createElement('div');
    div.innerHTML = `
        <input type="hidden" value="${data.education_id||''}">
        <input placeholder="Qualification" class="input">
        <input placeholder="Institution" class="input">
        <button onclick="saveEducation(this)" class="btn-update">Save</button>
        <button onclick="deleteItem(this,'education')" class="btn-delete">X</button>
    `;
    document.getElementById('education-container').appendChild(div);
}

async function saveEducation(btn){
    const el = btn.parentElement;
    const id = el.children[0].value;

    const payload = {
        qualification: el.children[1].value,
        institution: el.children[2].value
    };

    const res = await fetch(id?`/jobseeker/profile/education/${id}/`:'/jobseeker/profile/education/',{
        method:id?'PATCH':'POST',
        headers:getHeaders(),
        body:JSON.stringify(payload)
    });

    const d = await res.json();
    if(!id && d.success) el.children[0].value = d.data.education_id;
}

</script>

{% endblock %}

{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="max-w-7xl mx-auto space-y-6">

    <!-- ALERTS -->
    <div id="error-banner" class="hidden p-3 bg-red-100 text-red-700 rounded"></div>
    <div id="success-banner" class="hidden p-3 bg-green-100 text-green-700 rounded"></div>

    <form id="profileForm">
        {% csrf_token %}

        <!-- MAIN LAYOUT -->
        <div class="profile-layout">

            <!-- LEFT SIDE -->
            <div class="left-column">
                <div class="card sticky-card">
                    <h2 class="title">Personal Info</h2>

                    <input name="full_name" placeholder="Full Name" class="input">
                    <input name="phone_number" placeholder="Phone Number" class="input">
                    <input name="headline" placeholder="Headline" class="input">
                    <textarea name="bio" placeholder="Bio" class="input"></textarea>

                    <div class="flex gap-4 gender-group">
                        <label><input type="radio" name="gender" value="male"> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="other"> Other</label>
                    </div>

                    <button class="btn-save">Save Profile</button>
                </div>
            </div>

            <!-- RIGHT SIDE -->
            <div class="right-column">

                <!-- SKILLS -->
                <div class="card">
                    <div class="flex justify-between items-center">
                        <h2 class="title">Skills</h2>
                        <button type="button" onclick="addSkill()" class="btn-add">+ Add</button>
                    </div>
                    <div id="skills-container"></div>
                </div>

                <!-- LOCATIONS -->
                <div class="card">
                    <div class="flex justify-between items-center">
                        <h2 class="title">Locations</h2>
                        <button type="button" onclick="addLocation()" class="btn-add">+ Add</button>
                    </div>
                    <div id="locations-container"></div>
                </div>

                <!-- EXPERIENCE -->
<div class="card">
    <div class="flex justify-between items-center mb-4">
        <h2 class="title">Experience</h2>
        <button type="button"
                class="btn-add"
                onclick="addExperience()">
            + Add
        </button>
    </div>

    <div id="experience-container">
        <div class="dynamic-block">
            <input type="text"
                   name="company_name"
                   class="input"
                   placeholder="Company Name">

            <input type="text"
                   name="role"
                   class="input"
                   placeholder="Role">

            <textarea name="description"
                      class="input"
                      placeholder="Description"></textarea>

            <select name="employment_type" class="input">
                <option value="">Select Employment Type</option>
                <option value="fulltime">Full Time</option>
                <option value="parttime">Part Time</option>
                <option value="intern">Internship</option>
                <option value="contract">Contract</option>
            </select>

            <label class="field-label">Start Date</label>
            <input type="date"
                   name="start_date"
                   class="input"
                   required>

            <label class="field-label">End Date</label>
            <input type="date"
                   name="end_date"
                   class="input end-date">

            <label class="checkbox-label">
                <input type="checkbox"
                       name="is_current"
                       onchange="toggleCurrent(this)">
                I currently work here
            </label>
        </div>
    </div>
</div>

<!-- EDUCATION -->
<div class="card">
    <div class="flex justify-between items-center mb-4">
        <h2 class="title">Education</h2>
        <button type="button"
                class="btn-add"
                onclick="addEducation()">
            + Add
        </button>
    </div>

    <div id="education-container">
        <div class="dynamic-block">
            <input type="text"
                   name="qualification"
                   class="input"
                   placeholder="Qualification">

            <input type="text"
                   name="field_of_study"
                   class="input"
                   placeholder="Field of Study">

            <input type="text"
                   name="institution"
                   class="input"
                   placeholder="Institution">

            <label class="field-label">Start Year</label>
            <input type="number"
                   name="start_year"
                   class="input"
                   min="1950"
                   max="2100"
                   required>

            <label class="field-label">End Year</label>
            <input type="number"
                   name="end_year"
                   class="input end-year"
                   min="1950"
                   max="2100">

            <label class="checkbox-label">
                <input type="checkbox"
                       name="is_current"
                       onchange="toggleCurrent(this)">
                Currently Studying Here
            </label>
        </div>
    </div>
</div>

<style>
body {
    background: #f1f5f9;
}

/* Main Layout */
.profile-layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
    align-items: start;
}

/* Left Side */
.left-column {
    position: sticky;
    top: 20px;
}

/* Right Side Grid */
.right-column {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    align-items: start;
}

.right-column .card {
    min-height: 240px;
}

/* Cards */
.card {
    background: #ffffff;
    padding: 20px;
    border-radius: 14px;
    border: 1px solid #dbe3ef;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    box-sizing: border-box;
    width: 100%;
    transition: all 0.3s ease;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.10);
}

.title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 20px;
}

/* Inputs */
.input {
    width: 100%;
    margin-bottom: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    outline: none;
}

.input:focus {
    border-color: #6366f1;
}

/* Buttons */
.btn-add {
    background: #6366f1;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

.btn-save {
    background: #10b981;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    width: 100%;
    margin-top: 15px;
}

.btn-update {
    background: #3b82f6;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

.btn-delete {
    background: #ef4444;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

/* Responsive */
@media (max-width: 1024px) {
    .profile-layout {
        grid-template-columns: 1fr;
    }

    .left-column {
        position: static;
    }
}

.left-column .input,
.left-column textarea {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
}

.gender-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 10px;
    margin-bottom: 15px;
}

.btn-save {
    width: 100%;
    box-sizing: border-box;
}

.dynamic-block {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
}

.field-label {
    display: block;
    margin: 10px 0 6px;
    font-weight: 600;
    color: #374151;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0;
    font-size: 14px;
}

</style>

<script>

// ─────────── HELPERS ───────────
function getHeaders() {
    return {
        'Content-Type': 'application/json',
        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
    };
}

function showBanner(type, msg) {
    const err = document.getElementById('error-banner');
    const ok = document.getElementById('success-banner');
    err.classList.add('hidden');
    ok.classList.add('hidden');

    if (type === 'error') {
        err.innerText = msg;
        err.classList.remove('hidden');
    } else {
        ok.innerText = msg;
        ok.classList.remove('hidden');
    }
}

// ─────────── PROFILE SAVE ───────────
document.getElementById('profileForm').addEventListener('submit', async function(e){
    e.preventDefault();

    const payload = {
        full_name: document.querySelector('[name="full_name"]').value,
        phone_number: document.querySelector('[name="phone_number"]').value,
        headline: document.querySelector('[name="headline"]').value,
        bio: document.querySelector('[name="bio"]').value,
        gender: document.querySelector('input[name="gender"]:checked')?.value
    };

    const res = await fetch('/jobseeker/profile/', {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (data.success) {
        showBanner('success',"Profile Saved");
    } else {
        showBanner('error', JSON.stringify(data));
    }
});

// ─────────── COMMON DELETE ───────────
async function deleteItem(btn,type){
    const el = btn.parentElement;
    const id = el.querySelector('input[type=hidden]').value;

    if(id){
        await fetch(`/jobseeker/profile/${type}/${id}/`,{
            method:'DELETE',
            headers:getHeaders()
        });
    }
    el.remove();
}

// ─────────── SKILLS ───────────
function addSkill(data={}){
    const div = document.createElement('div');
    div.innerHTML = `
        <input type="hidden" value="${data.skill_id||''}">
        <input class="input" value="${data.skill_name||''}">
        <button onclick="saveSkill(this)" class="btn-update">Save</button>
        <button onclick="deleteItem(this,'skill')" class="btn-delete">X</button>
    `;
    document.getElementById('skills-container').appendChild(div);
}

async function saveSkill(btn){
    const el = btn.parentElement;
    const id = el.children[0].value;
    const name = el.children[1].value;

    const res = await fetch(id?`/jobseeker/profile/skill/${id}/`:'/jobseeker/profile/skill/',{
        method:id?'PATCH':'POST',
        headers:getHeaders(),
        body:JSON.stringify({skill_name:name})
    });

    const d = await res.json();
    if(!id && d.success) el.children[0].value = d.data.skill_id;
}

// ─────────── LOCATION ───────────
function addLocation(data={}){
    const div = document.createElement('div');
    div.innerHTML = `
        <input type="hidden" value="${data.location_id||''}">
        <input class="input" value="${data.location_name||''}">
        <button onclick="saveLocation(this)" class="btn-update">Save</button>
        <button onclick="deleteItem(this,'location')" class="btn-delete">X</button>
    `;
    document.getElementById('locations-container').appendChild(div);
}

async function saveLocation(btn){
    const el = btn.parentElement;
    const id = el.children[0].value;
    const name = el.children[1].value;

    const res = await fetch(id?`/jobseeker/profile/location/${id}/`:'/jobseeker/profile/location/',{
        method:id?'PATCH':'POST',
        headers:getHeaders(),
        body:JSON.stringify({location_name:name})
    });

    const d = await res.json();
    if(!id && d.success) el.children[0].value = d.data.location_id;
}

function addExperience(data = {}) {
    const container = document.getElementById("experience-container");

    const block = document.createElement("div");
    block.className = "dynamic-block";

    block.innerHTML = `
        <input type="hidden" value="${data.experience_id || ''}">

        <input class="input company" placeholder="Company Name" value="${data.company_name || ''}">
        <input class="input role" placeholder="Role" value="${data.role || ''}">
        <textarea class="input description">${data.description || ''}</textarea>

        <select class="input employment">
            <option value="">Select Type</option>
            <option value="fulltime">Full Time</option>
            <option value="parttime">Part Time</option>
            <option value="intern">Internship</option>
            <option value="contract">Contract</option>
        </select>

        <input type="date" class="input start" value="${data.start_date || ''}">
        <input type="date" class="input end-date" value="${data.end_date || ''}">

        <label>
            <input type="checkbox" class="current" ${data.is_current ? 'checked' : ''} onchange="toggleCurrent(this)">
            Current Job
        </label>

        <div class="flex gap-2 mt-2">
            <button onclick="saveExperience(this)" class="btn-update">Save</button>
            <button onclick="deleteExperience(this)" class="btn-delete">Delete</button>
        </div>
    `;

    container.appendChild(block);
}

async function saveExperience(btn) {
    const el = btn.closest('.dynamic-block');

    const id = el.querySelector('input[type="hidden"]').value;

    const payload = {
        company_name: el.querySelector('.company').value,
        role: el.querySelector('.role').value,
        description: el.querySelector('.description').value,
        employment_type: el.querySelector('.employment').value,
        start_date: el.querySelector('.start').value,
        end_date: el.querySelector('.end-date').value,
        is_current: el.querySelector('.current').checked
    };

    const res = await fetch(
        id ? `/jobseeker/profile/experience/${id}/`
           : `/jobseeker/profile/experience/`,
        {
            method: id ? 'PATCH' : 'POST',
            headers: getHeaders(),
            body: JSON.stringify(payload)
        }
    );

    const data = await res.json();

    if (data.success && !id) {
        el.querySelector('input[type="hidden"]').value = data.data.experience_id;
    }
}

async function deleteExperience(btn) {
    const el = btn.closest('.dynamic-block');
    const id = el.querySelector('input[type="hidden"]').value;

    if (id) {
        await fetch(`/jobseeker/profile/experience/${id}/`, {
            method: 'DELETE',
            headers: getHeaders()
        });
    }

    el.remove();
}

function addEducation(data = {}) {
    const container = document.getElementById("education-container");

    const block = document.createElement("div");
    block.className = "dynamic-block";

    block.innerHTML = `
        <input type="hidden" value="${data.education_id || ''}">

        <input class="input qualification" placeholder="Qualification" value="${data.qualification || ''}">
        <input class="input field" placeholder="Field of Study" value="${data.field_of_study || ''}">
        <input class="input institution" placeholder="Institution" value="${data.institution || ''}">

        <input type="number" class="input start-year" value="${data.start_year || ''}">
        <input type="number" class="input end-year" value="${data.end_year || ''}">

        <label>
            <input type="checkbox" class="current" ${data.is_current ? 'checked' : ''} onchange="toggleCurrent(this)">
            Currently Studying
        </label>

        <div class="flex gap-2 mt-2">
            <button onclick="saveEducation(this)" class="btn-update">Save</button>
            <button onclick="deleteEducation(this)" class="btn-delete">Delete</button>
        </div>
    `;

    container.appendChild(block);
}

async function saveEducation(btn) {
    const el = btn.closest('.dynamic-block');

    const id = el.querySelector('input[type="hidden"]').value;

    const payload = {
        qualification: el.querySelector('.qualification').value,
        field_of_study: el.querySelector('.field').value,
        institution: el.querySelector('.institution').value,
        start_year: el.querySelector('.start-year').value,
        end_year: el.querySelector('.end-year').value,
        is_current: el.querySelector('.current').checked
    };

    const res = await fetch(
        id ? `/jobseeker/profile/education/${id}/`
           : `/jobseeker/profile/education/`,
        {
            method: id ? 'PATCH' : 'POST',
            headers: getHeaders(),
            body: JSON.stringify(payload)
        }
    );

    const data = await res.json();

    if (data.success && !id) {
        el.querySelector('input[type="hidden"]').value = data.data.education_id;
    }
}

async function deleteEducation(btn) {
    const el = btn.closest('.dynamic-block');
    const id = el.querySelector('input[type="hidden"]').value;

    if (id) {
        await fetch(`/jobseeker/profile/education/${id}/`, {
            method: 'DELETE',
            headers: getHeaders()
        });
    }

    el.remove();
}

// ─────────── EXPERIENCE ───────────
function addExperience(data={}){
    const div = document.createElement('div');
    div.innerHTML = `
        <input type="hidden" value="${data.experience_id||''}">
        <input placeholder="Company" class="input">
        <input placeholder="Role" class="input">
        <button onclick="saveExperience(this)" class="btn-update">Save</button>
        <button onclick="deleteItem(this,'experience')" class="btn-delete">X</button>
    `;
    document.getElementById('experience-container').appendChild(div);
}

async function saveExperience(btn){
    const el = btn.parentElement;
    const id = el.children[0].value;

    const payload = {
        company_name: el.children[1].value,
        role: el.children[2].value
    };

    const res = await fetch(id?`/jobseeker/profile/experience/${id}/`:'/jobseeker/profile/experience/',{
        method:id?'PATCH':'POST',
        headers:getHeaders(),
        body:JSON.stringify(payload)
    });

    const d = await res.json();
    if(!id && d.success) el.children[0].value = d.data.experience_id;
}

// ─────────── EDUCATION ───────────
function addEducation(data={}){
    const div = document.createElement('div');
    div.innerHTML = `
        <input type="hidden" value="${data.education_id||''}">
        <input placeholder="Qualification" class="input">
        <input placeholder="Institution" class="input">
        <button onclick="saveEducation(this)" class="btn-update">Save</button>
        <button onclick="deleteItem(this,'education')" class="btn-delete">X</button>
    `;
    document.getElementById('education-container').appendChild(div);
}

async function saveEducation(btn){
    const el = btn.parentElement;
    const id = el.children[0].value;

    const payload = {
        qualification: el.children[1].value,
        institution: el.children[2].value
    };

    const res = await fetch(id?`/jobseeker/profile/education/${id}/`:'/jobseeker/profile/education/',{
        method:id?'PATCH':'POST',
        headers:getHeaders(),
        body:JSON.stringify(payload)
    });

    const d = await res.json();
    if(!id && d.success) el.children[0].value = d.data.education_id;
}

</script>


{% endblock %}

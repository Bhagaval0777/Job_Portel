{% extends "base.html" %}

{% block title %}Home - JobPortel{% endblock %}

{% block content %}
  <h2>Home</h2>
  <div id="content">
    <p>Loading user info…</p>

  </div>

  <script>
    // 1. Helper to get CSRF token for POST requests (Logout/Refresh)
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // 2. Specialized Fetch that handles Cookies and Token Refreshing
    async function authFetch(url, options = {}) {
        options.credentials = 'same-origin'; // Send cookies
        options.headers = {
            ...options.headers,
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json',
        };

        let response = await fetch(url, options);

        // If 401 (Expired Access Token), try to refresh
        if (response.status === 401) {
            const refreshRes = await fetch('/users/token/refresh/', { 
                method: 'POST',
                credentials: 'same-origin',
                headers: { 
                    'X-CSRFToken': getCookie('csrftoken'),
                    'Content-Type': 'application/json' 
                }
            });

            if (refreshRes.ok) {
                // Retry the original request
                return await fetch(url, options);
            } else {
                // Refresh failed, kick to login
                window.location.href = '/users/login/';
            }
        }
        return response;
    }

    // 3. Load User Data and Inject into DOM
    async function loadUser() {
        const container = document.getElementById('content');
        try {
            const res = await authFetch('/users/details/');
            
            if (res.ok) {
                const data = await res.json();
                
                // SECURITY: Use textContent for variables to prevent XSS
                container.innerHTML = `
                    <p>Welcome, <strong id="user-display"></strong></p>
                    <ul>
                        <li><strong>Username:</strong> <span id="u-name"></span></li>
                        <li><strong>Email:</strong> <span id="u-email"></span></li>
                    </ul>
                    <p><button id="logout-btn">Log out</button></p>
                `;

                container.querySelector('#user-display').textContent = data.username;
                container.querySelector('#u-name').textContent = data.username;
                container.querySelector('#u-email').textContent = data.email;

                // Handle Logout
                document.getElementById('logout-btn').addEventListener('click', async () => {
                    await authFetch('/users/logout/', { method: 'POST' });
                    window.location.href = '/users/login/';
                });
            } else {
                container.innerHTML = '<p>Not logged in. <a href="/users/login/">Login here</a></p>';
            }
        } catch (err) {
            console.error("Fetch error:", err);
            container.innerText = 'Error connecting to server.';
        }
    }

    // Run on page load
    document.addEventListener('DOMContentLoaded', loadUser);
  </script>

{% endblock %}

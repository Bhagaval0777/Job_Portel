{% extends "base.html" %}

{% block title %}Log in - JobPortel{% endblock %}

{% block content %}
<style>
  /* Container Styling */
  .login-container {
    max-width: 400px;
    margin: 50px auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  h2 {
    text-align: center;
    color: #333;
    margin-bottom: 25px;
    font-weight: 600;
  }

  /* Form Elements */
  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: #555;
    font-weight: 500;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-sizing: border-box; /* Crucial for width */
    transition: border-color 0.3s ease;
  }

  input[type="email"]:focus,
  input[type="password"]:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
  }

  /* Checkbox Styling */
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #666;
  }

  .checkbox-group input {
    cursor: pointer;
  }

  /* Button Styling */
  button {
    width: 100%;
    padding: 12px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #0056b3;
  }

  button:active {
    transform: translateY(1px);
  }
</style>

<div class="login-container">
  <h2>Log in</h2>

  <form id="login-form">
    <div class="form-group">
      <label for="id_email">Email Address</label>
      <input type="email" name="username" id="id_email" placeholder="name@example.com" required>
    </div>

    <div class="form-group">
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" placeholder="••••••••" required>
    </div>

    <button type="submit">Log in</button>
  </form>
</div>

<script>

// Helper to get CSRF token from cookies
// --- Helper: Get CSRF Token ---
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// --- AuthFetch: The Secure Wrapper ---
let isRefreshing = false;
let refreshSubscribers = [];

async function authFetch(url, options = {}) {
    options.credentials = 'same-origin'; // Vital for cookies
    options.headers = {
        ...options.headers,
        'X-CSRFToken': getCookie('csrftoken'),
        'Content-Type': 'application/json',
    };

    let response = await fetch(url, options);

    if (response.status === 401) {
        if (!isRefreshing) {
            isRefreshing = true;
            const refreshRes = await fetch('/users/token/refresh/', { 
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'X-CSRFToken': getCookie('csrftoken') }
            });

            if (refreshRes.ok) {
                isRefreshing = false;
                refreshSubscribers.forEach(cb => cb());
                refreshSubscribers = [];
                return fetch(url, options);
            } else {
                window.location.href = '/users/login/';
            }
        }

        return new Promise(resolve => {
            refreshSubscribers.push(() => resolve(fetch(url, options)));
        });
    }
    return response;
}

// --- Page Logic: Load User Data ---
async function loadUser() {
    const container = document.getElementById('content');
    if (!container) return;

    try {
        const res = await authFetch('/users/home/');
        if (res.ok) {
            const data = await res.json();
            container.innerHTML = `
                <h2>Welcome, <span id="username-display"></span></h2>
                <p>Email: <span id="email-display"></span></p>
                <button id="logout-btn">Log Out</button>
            `;
            document.getElementById('username-display').textContent = data.username;
            document.getElementById('email-display').textContent = data.email;

            document.getElementById('logout-btn').onclick = async () => {
                await authFetch('/users/logout/', { method: 'POST' });
                window.location.href = '/users/login/';
            };
        } else {
            container.innerHTML = '<p>Please <a href="/users/login/">Login</a></p>';
        }
    } catch (err) {
        container.innerText = "Error loading profile.";
    }
}

// --- Page Logic: Login Form ---
const loginForm = document.getElementById('login-form');
if (loginForm) {
    loginForm.onsubmit = async (e) => {
        e.preventDefault();
        const response = await fetch('/users/login/', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                username: document.getElementById('id_email').value,
                password: document.getElementById('id_password').value
            }),
            credentials: 'same-origin'
        });

        if (response.ok) {
            window.location.href = '/users/home/';
        } else {
            alert("Login Failed");
        }
    };
}

// Initialize
document.addEventListener('DOMContentLoaded', loadUser);

</script>
{% endblock %}
